<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="bunnyling-logo.svg">
<title>BunnyLing</title>
<style>
:root{--bg:#14121c;--card:#1f1b2e;--tx:#eee;--mu:#9a94b0;--ac:#8b5cf6;--new:#60a5fa;--lrn:#facc15;--kn:#4ade80;--bad:#f87171}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
main{padding:12px 14px 220px}
.view{display:none}.view.on{display:block}
h1{font-size:20px;margin:6px 0 12px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid #3a3454;border-radius:10px;padding:9px 12px}
button.pri{background:var(--ac);border:0}button.dng{color:var(--bad)}
label{display:block;margin:10px 0;color:var(--mu);font-size:14px}label input,label select{width:100%;margin-top:4px;color:var(--tx)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border-radius:12px;padding:12px;margin:8px 0}
video{width:100%;max-height:34vh;background:#000;border-radius:10px}
.p{padding:8px 10px;margin:6px 0;border-radius:10px;line-height:1.6;cursor:pointer}
.p.act{background:#2b2542}
.p small{display:block;color:var(--mu)}
.rw{border-bottom:2px solid transparent}
.rw[data-s=new]{color:var(--new)}.rw[data-s=learning]{color:var(--lrn)}
.rw[data-s=known]{color:var(--kn)}.rw[data-s=problematic]{color:var(--bad)}
.rw.cur{border-bottom-color:currentColor}
#bar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));background:#0e0c15;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
#bar .row{justify-content:center}#seek{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e0c15;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:0;font-size:12px;color:var(--mu)}nav .sel{color:var(--ac)}
#pop{position:fixed;left:10px;right:10px;bottom:calc(150px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--ac);border-radius:14px;padding:14px;z-index:5;max-height:55vh;overflow:auto}
#pop .row{margin-top:8px}#pw{font-size:18px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#000;padding:8px 14px;border-radius:20px;z-index:9;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section id="v-player" class="view on">
    <b id="ttl">Ningún archivo abierto</b>
    <div class="mu" id="sub">Elige un archivo en Biblioteca</div>
    <video id="vid" playsinline hidden></video>
    <div id="text"></div>
  </section>
  <section id="v-library" class="view">
    <h1>Biblioteca</h1>
    <button id="imp" class="pri">＋ Importar material</button>
    <div id="lib"></div>
  </section>
  <section id="v-words" class="view">
    <h1>Diccionario</h1>
    <div class="row" id="dfil">
      <button data-f="all">Todas</button><button data-f="new">🔵</button><button data-f="learning">🟡</button><button data-f="known">🟢</button><button data-f="problematic">🔴</button>
    </div>
    <input id="dq" type="search" placeholder="Buscar palabra…" style="width:100%;margin:8px 0">
    <div id="wl"></div>
  </section>
  <section id="v-settings" class="view">
    <h1>Ajustes</h1>
    <button id="inst" class="pri" hidden>📲 Instalar BunnyLing</button>
    <label>Idioma que aprendo<select id="c-src"></select></label>
    <label>Idioma que hablo<select id="c-tgt"></select></label>
    <label>Segundos de salto<input id="c-sk" type="number" min="1" max="300"></label>
    <label>Clave de Gemini<input id="c-gk" type="password" autocomplete="off"></label>
    <label>Modelo de Gemini<input id="c-gm" autocomplete="off"></label>
    <label>Clave de Deepgram<input id="c-dk" type="password" autocomplete="off"></label>
    <label>Voz Deepgram (TTS)<input id="c-dtts" autocomplete="off"></label>
    <button id="c-save" class="pri">Guardar</button>
    <p class="mu" style="margin-top:10px">Las claves se guardan solo en este dispositivo.</p>
  </section>
</main>

<div id="bar">
  <div class="row"><input id="seek" type="range" min="0" max="1000" value="0"><span id="tm" class="mu">0:00 / 0:00</span></div>
  <div class="row">
    <button id="spd">1x</button><button id="bk">⏪</button><button id="pp" class="pri">▶</button><button id="fw">⏩</button><button id="lk">❓</button>
  </div>
  <div class="row" id="subs-row" hidden><input id="goto" placeholder="Ir a 00:00:00" inputmode="numeric" style="width:130px"><button id="go">Ir</button></div>
</div>
<nav>
  <button data-v="player" class="sel">▶<br>Lector</button><button data-v="library">▤<br>Biblioteca</button>
  <button data-v="words">✧<br>Diccionario</button><button data-v="settings">⚙<br>Ajustes</button>
</nav>

<div id="pop" hidden>
  <b id="pw"></b>
  <p id="pm" class="mu"></p>
  <div class="row">
    <button id="p-audio">🔊 Escuchar</button>
    <button id="p-ai" class="pri">🤖 Traducir con IA</button>
  </div>
  <div class="row">
    <button id="p-no" class="dng">No la conozco ❌</button>
    <button id="p-yes" class="pri">Ya la conozco ✓</button>
    <button id="p-x">Cerrar</button>
  </div>
</div>
<div id="toast" hidden></div>
<input type="file" id="fi" multiple hidden accept=".txt,.srt,.vtt,.json,.mp3,.wav,.m4a,.ogg,.aac,.flac,.mp4,.webm,.mov,audio/*,video/*">

<script>
'use strict';
/* ===== Utilidades ===== */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const fmt = s => isFinite(s) ? `${s / 60 | 0}:${String(s % 60 | 0).padStart(2, '0')}` : '0:00';
let toastT;
const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3500); };
const LANGS = { en: 'Inglés', es: 'Español', fr: 'Francés', de: 'Alemán', it: 'Italiano', pt: 'Portugués', ja: 'Japonés', ko: 'Coreano', zh: 'Chino' };
const KIND = { txt: 'txt' };
'mp4 webm mov'.split(' ').forEach(x => KIND[x] = 'video');
'srt vtt json'.split(' ').forEach(x => KIND[x] = 'subs');
'mp3 wav m4a ogg aac flac'.split(' ').forEach(x => KIND[x] = 'audio');

/* ===== Ajustes ===== */
const loadCfg = () => { try { return JSON.parse(localStorage.getItem('bunnyling_settings')) || {}; } catch { return {}; } };
const cfg = { sourceLanguage: 'en', targetLanguage: 'es', skip: 15, geminiKey: '', geminiModel: 'gemini-3.5-flash-lite',
  deepgramKey: '', deepgramTTSModel: 'aura-2-thalia-en', ...loadCfg() };

/* ===== IndexedDB ===== */
const DB = (() => {
  const open = indexedDB.open('bunnyling-v1', 1);
  open.onupgradeneeded = () => {
    open.result.createObjectStore('files', { keyPath: 'id' });
    open.result.createObjectStore('dict', { keyPath: 'word' });
  };
  const ready = new Promise((ok, no) => { open.onsuccess = () => ok(open.result); open.onerror = () => no(open.error); });
  const run = async (store, mode, fn) => {
    const db = await ready;
    return new Promise((ok, no) => {
      const tx = db.transaction(store, mode), rq = fn(tx.objectStore(store));
      tx.oncomplete = () => ok(rq?.result); tx.onerror = tx.onabort = () => no(tx.error);
    });
  };
  const api = store => ({
    all: () => run(store, 'readonly', s => s.getAll()),
    put: x => run(store, 'readwrite', s => s.put(x)),
    del: k => run(store, 'readwrite', s => s.delete(k))
  });
  return { files: api('files'), dict: api('dict') };
})();

/* ===== Diccionario de palabras (solo cuenta lo ya leído) ===== */
const WORD_RE = /\p{L}[\p{L}\p{N}]*(?:[-'’][\p{L}\p{N}]+)*/gu;
const normKey = w => w.toLowerCase().replace(/’/g, "'");
const DICT = new Map();
const stateOf = k => DICT.get(k)?.state || 'new';

function bump(e, n) {
  e.totalSeen += n; e.lastSeen = Date.now();
  if (e.manual) return;
  if (e.state === 'problematic') { e.clean = (e.clean || 0) + n; if (e.clean >= 25) e.state = 'known'; return; }
  if (e.state === 'known') return;
  e.state = e.totalSeen >= 25 ? 'known' : e.totalSeen >= 2 ? 'learning' : 'new';
}
const entryFor = k => { let e = DICT.get(k); if (!e) DICT.set(k, e = { word: k, state: 'new', totalSeen: 0, lastSeen: Date.now(), manual: false }); return e; };
const recolor = keys => keys.forEach(k => $$(`.rw[data-word="${CSS.escape(k)}"]`).forEach(n => n.dataset.s = stateOf(k)));

const seen = new Set();               // párrafos ya contados en esta apertura
function countParagraph(i) {
  if (seen.has(i) || !S.paras[i]) return;
  seen.add(i);
  const freq = new Map();
  for (const w of S.paras[i].text.match(WORD_RE) || []) { const k = normKey(w); freq.set(k, (freq.get(k) || 0) + 1); }
  const changed = [];
  for (const [k, n] of freq) {
    const e = entryFor(k), before = e.state;
    bump(e, n); DB.dict.put(e);
    if (e.state !== before) changed.push(k);
  }
  recolor(changed);
}

/* ===== Parsers ===== */
const toSec = t => t.replace(',', '.').split(':').reduce((a, v) => a * 60 + parseFloat(v), 0);
const cue = (text, start = 0, end = 0) => ({ text, start, end });
function parseSubs(raw) {
  const src = String(raw ?? '').replace(/^\uFEFF/, '').trim();
  if (!src) return [];
  if (/^[\[{]/.test(src)) {
    try {
      const d = JSON.parse(src), rows = Array.isArray(d) ? d : d.cues || d.subtitles || d.events || d.transcript || [];
      return rows.map(x => {
        const text = String(x.text ?? x.content ?? x.subtitle ?? x.caption ?? '').trim();
        const s = Number(x.start ?? x.startTime ?? x.from ?? x.begin ?? 0);
        return text ? cue(text, s, Math.max(s + .1, Number(x.end ?? x.endTime ?? x.to ?? s + 3))) : null;
      }).filter(Boolean).sort((a, b) => a.start - b.start);
    } catch {}
  }
  return src.replace(/\r/g, '').split(/\n(?:[ \t]*\n)+/).flatMap(b => {
    const L = b.split('\n'), i = L.findIndex(l => l.includes('-->'));
    if (i < 0) return [];
    const [a, c] = L[i].split('-->'), t = x => toSec(x.trim().split(/\s/)[0]);
    const text = L.slice(i + 1).join(' ').replace(/<[^>]+>/g, '').trim();
    return text ? [cue(text, t(a), t(c))] : [];
  }).sort((a, b) => a.start - b.start);
}
function parseText(raw) {
  return String(raw ?? '').replace(/^\uFEFF|\u0000/g, '').replace(/\r\n?/g, '\n').split(/\n[ \t]*\n+/)
    .map(p => p.split('\n').map(l => l.trim()).filter(Boolean).join(' ')).filter(Boolean).flatMap(p => {
      if (p.length <= 700) return [cue(p)];
      const out = []; let part = '';
      for (const s of p.match(/[^.!?。！？]+[.!?。！？]?/gu) || [p]) {
        if (part && part.length + s.length > 600) { out.push(cue(part)); part = ''; }
        part += (part ? ' ' : '') + s.trim();
      }
      return part ? [...out, cue(part)] : out;
    });
}

/* ===== Estado y reproductor ===== */
const S = { files: [], file: null, kind: null, paras: [], act: -1, pick: null, url: null, subTime: 0, subTimer: null };
const V = $('#vid');
const speeds = [1, 1.25, 1.5, .75]; let spdI = 0;

const clock = {
  get time() { return S.subTime; },
  set time(t) { S.subTime = Math.max(0, t); tick(); },
  get paused() { return !S.subTimer; },
  get duration() { return Math.max(0, ...S.paras.map(p => p.end)); },
  play() { this.pause(); S.subTimer = setInterval(() => { S.subTime = Math.min(this.duration, S.subTime + .1 * V.playbackRate); tick(); }, 100); tick(); },
  pause() { clearInterval(S.subTimer); S.subTimer = null; tick(); }
};
const M = () => S.kind === 'subs' ? clock : V;
const hasTime = () => ['video', 'audio', 'subs'].includes(S.kind);

function tick() {
  if (!hasTime()) return;
  const m = M(), d = m.duration || 0;
  $('#seek').value = d ? m.time / d * 1000 : 0;
  $('#tm').textContent = `${fmt(m.time)} / ${fmt(d)}`;
  $('#pp').textContent = m.paused ? '▶' : '⏸';
  const i = S.paras.findIndex(p => m.time >= p.start && m.time < p.end);
  if (i >= 0 && i !== S.act) setAct(i);
}
function setAct(i) {
  $$('.p.act').forEach(n => n.classList.remove('act'));
  const n = $(`.p[data-i="${i}"]`); S.act = i;
  if (n) { n.classList.add('act'); n.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  countParagraph(i);
}
['timeupdate', 'play', 'pause', 'loadedmetadata'].forEach(ev => V.addEventListener(ev, tick));

/* ===== Render del texto ===== */
function wordSpans(text) {
  const out = []; let pos = 0;
  for (const m of text.matchAll(WORD_RE)) {
    if (m.index > pos) out.push(document.createTextNode(text.slice(pos, m.index)));
    const s = el('span', 'rw', m[0]); s.dataset.word = normKey(m[0]); s.dataset.s = stateOf(s.dataset.word);
    out.push(s); pos = m.index + m[0].length;
  }
  if (pos < text.length) out.push(document.createTextNode(text.slice(pos)));
  return out;
}
let io;
function render() {
  const box = $('#text'); box.replaceChildren(); seen.clear(); io?.disconnect();
  S.paras.forEach((p, i) => { const d = el('div', 'p'); d.dataset.i = i; d.append(...wordSpans(p.text)); box.append(d); });
  if (S.kind === 'txt') {                       // texto: cuenta lo que realmente se ve
    io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && countParagraph(+e.target.dataset.i)), { threshold: .6 });
    $$('.p').forEach(n => io.observe(n));
  }
}

/* ===== Biblioteca ===== */
const ext = n => n.split('.').pop().toLowerCase();
async function importFiles(list) {
  for (const f of list) {
    const kind = KIND[ext(f.name)];
    if (!kind) { toast(`Formato no soportado: ${f.name}`); continue; }
    await DB.files.put({ id: crypto.randomUUID(), name: f.name, kind, blob: f, size: f.size, lastOpened: Date.now() });
  }
  await refresh(); toast('Importado ✓');
}
async function refresh() {
  S.files = (await DB.files.all()).sort((a, b) => b.lastOpened - a.lastOpened);
  const box = $('#lib'); box.replaceChildren();
  if (!S.files.length) box.append(el('p', 'mu', 'Biblioteca vacía'));
  for (const f of S.files) {
    const c = el('div', 'card row'), t = el('div', '', f.name); t.style.flex = 1;
    const open = el('button', 'pri', 'Abrir'), del = el('button', 'dng', '🗑');
    open.onclick = () => openItem(f); del.onclick = async () => { await DB.files.del(f.id); refresh(); };
    c.append(t, open, del); box.append(c);
  }
}
async function openItem(f) {
  clock.pause(); V.pause(); URL.revokeObjectURL(S.url);
  S.file = f; S.kind = f.kind; S.act = -1; S.subTime = 0;
  f.lastOpened = Date.now(); DB.files.put(f);
  const media = f.kind === 'video' || f.kind === 'audio';
  V.hidden = f.kind !== 'video';
  if (media) { S.url = URL.createObjectURL(f.blob); V.src = S.url; }
  const sub = media && S.files.find(x => x.kind === 'subs' && x.name.replace(/\.[^.]+$/, '') === f.name.replace(/\.[^.]+$/, ''));
  S.paras = f.kind === 'txt' ? parseText(await f.blob.text()) : f.kind === 'subs' ? parseSubs(await f.blob.text())
    : sub ? parseSubs(await sub.blob.text()) : [];
  $('#ttl').textContent = f.name;
  $('#sub').textContent = media && !sub ? 'Sin subtítulos: impórtalos con el mismo nombre del archivo' : f.kind === 'subs' ? 'Modo solo subtítulos' : '';
  $('#subs-row').hidden = f.kind !== 'subs';
  $$('#seek,#spd,#bk,#fw,#pp').forEach(n => n.hidden = f.kind === 'txt');
  render(); tick(); show('player');
}

/* ===== Navegación ===== */
function show(v) {
  $$('.view').forEach(n => n.classList.toggle('on', n.id === 'v-' + v));
  $$('nav button').forEach(n => n.classList.toggle('sel', n.dataset.v === v));
  $('#bar').hidden = v !== 'player';
  if (v === 'words') renderWords();
}
$$('nav button').forEach(b => b.onclick = () => show(b.dataset.v));

/* ===== Controles ===== */
$('#imp').onclick = () => $('#fi').click();
$('#fi').onchange = e => { importFiles([...e.target.files]); e.target.value = ''; };
$('#pp').onclick = () => { if (!hasTime()) return; const m = M(); m.paused ? m.play() : m.pause(); };
$('#bk').onclick = () => { if (hasTime()) M().time = M().time - cfg.skip; };
$('#fw').onclick = () => { if (hasTime()) M().time = M().time + cfg.skip; };
$('#seek').oninput = e => { if (hasTime()) M().time = e.target.value / 1000 * (M().duration || 0); };
$('#spd').onclick = () => { spdI = (spdI + 1) % speeds.length; V.playbackRate = speeds[spdI]; $('#spd').textContent = speeds[spdI] + 'x'; };
$('#go').onclick = () => {
  const t = $('#goto').value.trim();
  if (!/^\d+(:\d{1,2}){0,2}$/.test(t)) return toast('Formato: 1:23:45');
  clock.time = toSec(t);
};

/* ===== Selección de palabras y popup ===== */
$('#text').addEventListener('click', e => {
  const w = e.target.closest('.rw'), p = e.target.closest('.p');
  if (!p) return;
  if (hasTime() && S.paras[p.dataset.i]) M().time = S.paras[p.dataset.i].start;
  const sel = String(getSelection()).trim();
  const word = sel || w?.textContent;
  if (!word) return;
  S.pick = { word, ctx: S.paras[p.dataset.i]?.text || '', single: !sel || !/\s/.test(sel) };
  $('#pw').textContent = word; $('#pm').textContent = ''; $('#pop').hidden = false;
  speak(word);
});
$('#lk').onclick = () => {
  const sel = String(getSelection()).trim();
  if (!sel) return toast('Selecciona texto primero');
  S.pick = { word: sel, ctx: S.paras[S.act]?.text || sel, single: !/\s/.test(sel) };
  $('#pw').textContent = sel; $('#pm').textContent = ''; $('#pop').hidden = false;
};
$('#p-x').onclick = () => { $('#pop').hidden = true; S.pick = null; };
$('#p-audio').onclick = () => S.pick && speak(S.pick.word, true);
$('#p-ai').onclick = async () => {
  if (!S.pick) return;
  $('#pm').textContent = 'Traduciendo…';
  try {
    const tgt = LANGS[cfg.targetLanguage], src = LANGS[cfg.sourceLanguage];
    $('#pm').textContent = await gemini(`Traduce al ${tgt} el texto en ${src} «${S.pick.word}» según este contexto: «${S.pick.ctx}». Responde solo con el significado, breve.`);
  } catch (e) { $('#pm').textContent = e.message; }
};
function markWord(state) {
  if (!S.pick?.single) return toast('Marca una sola palabra');
  const k = normKey(S.pick.word), e = entryFor(k);
  e.state = state; e.manual = state === 'known'; e.clean = 0; e.lastSeen = Date.now();
  DB.dict.put(e); recolor([k]); $('#p-x').click();
}
$('#p-no').onclick = () => markWord('problematic');
$('#p-yes').onclick = () => markWord('known');

/* ===== APIs (Gemini / Deepgram) ===== */
async function gemini(prompt) {
  if (!cfg.geminiKey) throw new Error('Falta la clave de Gemini en Ajustes');
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg.geminiModel}:generateContent`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cfg.geminiKey },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
  });
  if (!r.ok) throw new Error(`Gemini respondió ${r.status}`);
  return (await r.json()).candidates?.[0]?.content?.parts?.map(p => p.text).join('').trim() || 'Sin respuesta';
}
const ttsCache = new Map(); let ttsAudio;
async function speak(text, loud) {
  if (!cfg.deepgramKey) { if (loud) toast('Falta la clave de Deepgram en Ajustes'); return; }
  try {
    let url = ttsCache.get(text);
    if (!url) {
      const r = await fetch(`https://api.deepgram.com/v1/speak?model=${encodeURIComponent(cfg.deepgramTTSModel)}`, {
        method: 'POST', headers: { Authorization: `Token ${cfg.deepgramKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      if (!r.ok) throw new Error(`Deepgram respondió ${r.status}`);
      url = URL.createObjectURL(await r.blob()); ttsCache.set(text, url);
    }
    ttsAudio?.pause(); ttsAudio = new Audio(url); ttsAudio.play();
  } catch (e) { toast(e.message); }
}

/* ===== Vista del diccionario ===== */
let dfilter = 'all';
$$('#dfil button').forEach(b => b.onclick = () => { dfilter = b.dataset.f; renderWords(); });
$('#dq').oninput = renderWords;
function renderWords() {
  const q = $('#dq').value.trim().toLowerCase(), box = $('#wl'); box.replaceChildren();
  const list = [...DICT.values()].filter(e => (dfilter === 'all' || e.state === dfilter) && e.word.includes(q))
    .sort((a, b) => b.totalSeen - a.totalSeen).slice(0, 200);
  $('#v-words h1').textContent = `Diccionario (${DICT.size})`;
  for (const e of list) {
    const c = el('div', 'card row'), w = el('span', 'rw', e.word); w.dataset.s = e.state;
    c.append(w, el('span', 'mu', ` ×${e.totalSeen}`)); box.append(c);
  }
}

/* ===== Ajustes ===== */
function fillSettings() {
  for (const id of ['c-src', 'c-tgt']) { const s = $('#' + id); s.replaceChildren(...Object.entries(LANGS).map(([k, v]) => new Option(v, k))); }
  $('#c-src').value = cfg.sourceLanguage; $('#c-tgt').value = cfg.targetLanguage; $('#c-sk').value = cfg.skip;
  $('#c-gk').value = cfg.geminiKey; $('#c-gm').value = cfg.geminiModel; $('#c-dk').value = cfg.deepgramKey; $('#c-dtts').value = cfg.deepgramTTSModel;
}
$('#c-save').onclick = () => {
  Object.assign(cfg, { sourceLanguage: $('#c-src').value, targetLanguage: $('#c-tgt').value, skip: Math.max(1, +$('#c-sk').value || 15),
    geminiKey: $('#c-gk').value.trim(), geminiModel: $('#c-gm').value.trim(), deepgramKey: $('#c-dk').value.trim(), deepgramTTSModel: $('#c-dtts').value.trim() });
  localStorage.setItem('bunnyling_settings', JSON.stringify(cfg)); toast('Guardado ✓');
};

/* ===== PWA ===== */
let deferred;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('#inst').hidden = false; });
$('#inst').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('#inst').hidden = true; };
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ===== Arranque ===== */
(async () => {
  fillSettings(); show('player');
  try { (await DB.dict.all()).forEach(e => DICT.set(e.word, e)); } catch {}
  await refresh();
})();
</script>
